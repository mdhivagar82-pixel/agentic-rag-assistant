services:
  - type: web
    name: agentic-rag-backend
    env: python
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://agentic-rag-assistant.vercel.app,http://localhost:5173"

  - type: web
    name: agentic-qdrant
    env: docker
    image:
      url: qdrant/qdrant:v1.9.0
    disk:
      name: qdrant-data
      mountPath: /qdrant/storage
      sizeGB: 10
